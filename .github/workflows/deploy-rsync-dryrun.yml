name: (SIMULACION) Deploy por rsync - dry run

# Workflow TEMPORAL de validacion. No modifica nada en el VPS.
# Corre en paralelo al deploy real para comparar que haria el metodo rsync
# antes de reemplazar el metodo actual (git fetch en el VPS).
#
# Objetivo: revisar en el log que NO aparezca ninguna linea "*deleting"
# sobre .env ni sobre data/local.db*
#
# Una vez validado, su contenido se integra a deploy.yml y este archivo se borra.
#
# ---------------------------------------------------------------------------
# Por que hay DOS llamadas a rsync
# ---------------------------------------------------------------------------
# El directorio data/ pertenece al UID 10001 (el usuario del contenedor) con
# modo 755, asi que el usuario del deploy NO puede crear ni borrar archivos
# dentro. Si puede, en cambio, sobrescribir los archivos que ya existen ahi,
# porque esos si le pertenecen (-rw-rw-r-- deploy deploy).
#
#   1. Codigo    -> todo menos data/, con --delete y escritura atomica.
#   2. Plantillas-> solo data/, con --inplace (escribe sobre el archivo, sin
#                   crear temporales) y SIN --delete.
#
# La llamada 2 no lleva --delete a proposito: no depende de una lista de
# excludes para proteger la base de datos, simplemente no tiene la capacidad
# de borrar. local.db queda a salvo por diseno.

on:
  push:
    branches:
      - main

# Grupo distinto al del deploy real para no bloquearlo
concurrency:
  group: deploy-vps-dryrun
  cancel-in-progress: true

jobs:
  simulacion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnostico de permisos en el VPS (informativo)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd "${{ secrets.VPS_PATH }}"
             echo "--- directorio data/ ---"
             ls -ld data
             echo "--- contenido ---"
             ls -l data
             echo "--- puede el deploy escribir el DIRECTORIO? ---"
             if [ -w data ]; then
               echo "SI (rsync podria crear y borrar archivos ahi)"
             else
               echo "NO (por eso las plantillas van con --inplace y sin --delete)"
             fi
             echo "--- puede el deploy sobrescribir las PLANTILLAS? ---"
             for f in data/*.xlsx data/*.csv; do
               [ -e "$f" ] || continue
               if [ -w "$f" ]; then echo "  OK   $f"; else echo "  FALLA $f"; fi
             done'

      # --dry-run: rsync calcula y reporta, pero NO escribe ni borra nada.
      # --itemize-changes: imprime una linea por cada cambio que haria.
      - name: SIMULAR sync de codigo (todo menos data/)
        run: |
          rsync -az --delete --dry-run --itemize-changes \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || 22 }}" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'node_modules' \
            --exclude 'logs/' \
            --exclude 'temp/' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/" \
            | tee /tmp/rsync-codigo.txt

      # Sin --delete: esta llamada no puede borrar nada, ni siquiera en teoria.
      # --inplace evita el temporal+rename que exigiria permiso de escritura
      # sobre el directorio data/, que pertenece al UID 10001.
      - name: SIMULAR sync de plantillas (solo data/)
        run: |
          rsync -az --inplace --dry-run --itemize-changes \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || 22 }}" \
            --exclude 'local.db*' \
            ./data/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/data/" \
            | tee /tmp/rsync-plantillas.txt

      - name: Auditar que no se borre nada critico
        run: |
          cat /tmp/rsync-codigo.txt /tmp/rsync-plantillas.txt > /tmp/rsync-plan.txt

          echo "=============================================="
          echo "  ARCHIVOS QUE SE BORRARIAN EN EL VPS"
          echo "=============================================="
          if grep -q '^\*deleting' /tmp/rsync-plan.txt; then
            grep '^\*deleting' /tmp/rsync-plan.txt
          else
            echo "(ninguno)"
          fi
          echo ""

          # Falla el job si algo critico aparece en la lista de borrado
          if grep -E '^\*deleting .*(\.env|local\.db)' /tmp/rsync-plan.txt; then
            echo "PELIGRO: la simulacion borraria un archivo critico."
            echo "NO integrar este workflow a deploy.yml. Revisar los excludes."
            exit 1
          fi

          echo "OK: ni .env ni data/local.db* aparecen en la lista de borrado."
